# Herald OS lock screen (swaylock). Installed to ~/.config/swaylock/config; the theme engine
# rewrites the colours when a theme is applied.
daemonize
ignore-empty-password
show-failed-attempts
indicator-radius=84
indicator-thickness=6
font=Inter
font-size=22

color=04113f
inside-color=0a2a96cc
inside-clear-color=0a2a96cc
inside-ver-color=0a2a96cc
inside-wrong-color=3a0a1acc
ring-color=4d92ff
ring-clear-color=36e6a6
ring-ver-color=36e6a6
ring-wrong-color=ff6b6b
key-hl-color=36e6a6
bs-hl-color=ff6b6b
line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000
text-color=ffffff
text-clear-color=ffffff
text-ver-color=ffffff
text-wrong-color=ffffff
